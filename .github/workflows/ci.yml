name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, and model quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Lint Python files
        run: ruff check src tests --select E9,F63,F7,F82

      - name: Run unit tests
        run: python -m pytest tests/ -v

      # This checks the committed offline holdout report. Fresh training and
      # ONNX integration tests require DVC model/data artifacts; no DVC remote
      # is configured for this local-only project yet.
      - name: Enforce clean holdout FPR gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          metrics = json.loads(Path("reports/metrics.json").read_text())
          fpr = metrics["prod_clean_holdout"]["fpr"]
          print(f"Prod clean holdout FPR: {fpr:.4f} (limit: 0.0150)")
          if fpr > 0.015:
              raise SystemExit("Holdout FPR exceeds the 1.5% quality limit")
          PY
